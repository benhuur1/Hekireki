# Workflow para buildar o app Vite e publicar no GitHub Pages
name: Deploy to GitHub Pages

on:
  # Roda a cada push na branch main
    push:
        branches: [main]
          # Permite rodar manualmente pela aba Actions
            workflow_dispatch:

            # Permissões necessárias para o deploy no Pages
            permissions:
              contents: read
                pages: write
                  id-token: write

                  # Garante que só um deploy rode por vez (cancela runs antigos em andamento)
                  concurrency:
                    group: pages
                      cancel-in-progress: false

                      jobs:
                        build:
                            runs-on: ubuntu-latest
                                steps:
                                      - name: Checkout
                                              uses: actions/checkout@v4

                                                    - name: Setup Node
                                                            uses: actions/setup-node@v4
                                                                    with:
                                                                              node-version: 20
                                                                                        cache: npm

                                                                                              - name: Install dependencies
                                                                                                      run: npm ci

                                                                                                            - name: Build
                                                                                                                    run: npm run build

                                                                                                                          - name: Setup Pages
                                                                                                                                  uses: actions/configure-pages@v5

                                                                                                                                        - name: Upload artifact
                                                                                                                                                uses: actions/upload-pages-artifact@v3
                                                                                                                                                        with:
                                                                                                                                                                  # Pasta de saída do build do Vite
                                                                                                                                                                            path: ./dist

                                                                                                                                                                              deploy:
                                                                                                                                                                                  needs: build
                                                                                                                                                                                      runs-on: ubuntu-latest
                                                                                                                                                                                          environment:
                                                                                                                                                                                                name: github-pages
                                                                                                                                                                                                      url: ${{ steps.deployment.outputs.page_url }}
                                                                                                                                                                                                          steps:
                                                                                                                                                                                                                - name: Deploy to GitHub Pages
                                                                                                                                                                                                                        id: deployment
                                                                                                                                                                                                                                uses: actions/deploy-pages@v4

